<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sky finder · ExoScope</title><link rel="stylesheet" href="atlas.css"><style>.charts{display:grid;grid-template-columns:1fr 1.4fr;gap:15px}.viz,.readout{background:#111e29;border:1px solid #30434e;border-radius:12px;padding:18px}.viz h2{font:25px Georgia;margin:0}.viz svg{width:100%;height:255px}.viz svg text{fill:#becedb;font:12px "Segoe UI",sans-serif}.readout{margin:15px 0;display:flex;flex-wrap:wrap;align-items:center;gap:24px}.readout b{font-size:24px;display:block}.readout small{color:#9de2e7}.replayline{display:flex;gap:15px;align-items:center;margin:18px 0}.replayline input{flex:1;accent-color:#88d5db}.formgrid label input{max-width:195px}.note a{color:#a7e6ef;text-decoration:underline}@media(max-width:750px){.charts{grid-template-columns:1fr}.viz svg{height:220px}}</style></head><body><header class="top"><div class="frame topbar"><a class="wordmark" href="./index.html"><i></i>ExoScope</a><nav><a class="navbutton" href="./index.html">Object atlas</a></nav></div></header><main class="frame planner"><p class="kicker">Observing desk</p><h1 id="title">Sky finder</h1><p class="note">Follow an object from local noon to noon. North is up, east is right. The rim of the finder is the horizon.</p><form class="formgrid" id="settings"><label>Object<select id="obj"></select></label><label>Find by name or alias<input type="search" id="search" list="names" placeholder="e.g. M42 or Orion Nebula"><datalist id="names"></datalist></label><label>Observing site<select id="site"><option>Bhopal</option><option>Paranal</option><option>Mauna Kea</option><option>Greenwich</option><option>Custom</option></select></label><label>Latitude °N<input id="lat" type="number" step="any" min="-90" max="90" required value="23.2599"></label><label>Longitude °E<input id="lon" type="number" step="any" min="-180" max="180" required value="77.4126"></label><label>UTC offset (hours)<input id="offset" type="number" step=".25" min="-12" max="14" required value="5.5"></label><label>Local evening date<input type="date" min="2025-01-02" max="2030-12-30" required id="date"></label></form><p id="message" role="status"></p><div id="views"><div class="readout" id="readout"></div><div class="charts"><section class="viz"><h2>Sky track</h2><svg viewBox="0 0 320 260" id="sky" role="img" aria-label="Local horizon finder"></svg></section><section class="viz"><h2>Altitude through the night</h2><svg viewBox="0 0 510 235" id="alt" role="img" aria-label="Altitude over 24 hours"></svg><small>Shading marks astronomical night (Sun below −18°).</small></section></div><label class="replayline">Local time<input type="range" min="0" max="1440" step="5" value="540" id="time"><output id="clock"></output></label><p class="note" id="source"></p></div></main><script type="module" src="./sky.js"></script></body></html>
